[project]
name = "scrollless"
version = "0.1.0"
description = "A daily email digest of top Reddit and Hacker News discussions, summarized by an LLM."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "abdessettar" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reddit", "hacker-news", "digest", "newsletter", "llm", "summarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]

dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "openai>=1.30.0",
]

[project.scripts]
scrollless = "scrollless.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrollless"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scrollless", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "TID",          # tidy imports
    "PL",           # pylint subset
    "ARG",          # unused arguments
    "PTH",          # use pathlib
    "RET",          # return values
    "C4",           # comprehensions
]
ignore = [
    "PLR0913",      # too many arguments
    "PLR2004",      # magic value comparison
    "E501",         # line length (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG"]

[tool.ruff.format]
quote-style = "double"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = false
show_error_codes = true
pretty = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=scrollless",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scrollless"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
